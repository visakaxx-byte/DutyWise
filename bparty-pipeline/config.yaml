      hs: "4910006000"
    日历:
      category: "日历"
      hs: "4910006000"
    笔记本:
      category: "日历"
      hs: "4910006000"
    便签:
      category: "日历"
      hs: "4910006000"
    记事本:
      category: "日历"
      hs: "4910006000"

    # ============ 计算机/键盘 → 键盘 (8471602000) ============
