      category: "置物架"
      hs: "3924104000"
    塑料盒:
      category: "置物架"
      hs: "3924104000"
    收纳盒:
      category: "置物架"
      hs: "3924104000"
    保鲜盒:
      category: "置物架"
      hs: "3924104000"
    书窗灯箱:
      category: "置物架"
      hs: "3924104000"
    灯箱:
      category: "置物架"
      hs: "3924104000"

    # ============ 包袋/钱夹 → PVC袋 (3923210095) ============
