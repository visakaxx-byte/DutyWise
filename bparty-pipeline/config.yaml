  # 合并设置
  merge:
    enabled: true
    # 合并条件: 仅按 品名+HS编码 合并 (不按材质，便于跨材质归并)
    group_by:
      - "中文品名"
      - "商品编码"
    # 合并时对数值字段的处理
    sum_fields:
      - "数量"
      - "净重"
      - "毛重"
      - "箱数"
      - "总价"

# --- 跨章HS优化 ---
cross_optimizer:
  # 最低品名相似度
  min_similarity: 0.20

  # 税率得分权重
  tax_weight: 0.5
  similarity_weight: 0.5

  # 综合得分采纳阈值 (更高 → 更保守，不轻易替换)
  adopt_threshold: 0.65

  # 优先目标4位品目 (白名单)
  preferred_chapters:
    - "3923"   # 塑料运输包装
    - "3924"   # 塑料餐具/厨具/卫生间用具
    - "3926"   # 其他塑料制品
    - "4202"   # 旅行用品/手提包
    - "4820"   # 纸本/笔记本/文件夹
    - "4823"   # 其他切成形的纸/纸板
    - "4910"   # 印刷日历/图片
    - "6302"   # 床单/桌布/毛巾
    - "6307"   # 其他纺织制品
    - "6702"   # 人造花/叶/果实及零件
    - "6913"   # 陶瓷装饰品
    - "7326"   # 其他钢铁制品
    - "7616"   # 其他铝制品
    - "8306"   # 贱金属装饰品
    - "8471"   # 计算机/数据处理设备
    - "8504"   # 变压器/电源适配器
    - "8517"   # 电话/通讯设备
    - "8518"   # 音频设备/耳机/音箱
    - "8539"   # 电灯/灯具
    - "8544"   # 绝缘电线/电缆/数据线
    - "9403"   # 其他家具及零件
    - "9405"   # 灯具/灯箱/发光标志
    - "9503"   # 玩具/模型/拼图
    - "9505"   # 节日/狂欢节/其他娱乐用品
    - "9506"   # 体育器材/户外用品
    - "9615"   # 梳子/发夹/发饰
    - "9617"   # 保温瓶及其他真空容器

  # 白名单候选的相似度加成
  chapter_boost: 0.10

  # 排除条件
  exclude_anti_dumping: false
  exclude_certification_required: true

# --- 低申报策略 ---
devaluation:
  # 单价乘数
  price_multiplier: 0.12

  # 数量乘数
  quantity_multiplier: 1.0

  # 总价封顶 (USD)
  total_cap: 12000

  # 保护字段
  protected_fields:
    - "毛重"
    - "箱数"

# ============================================================
# aggressive 模式预设 (覆盖 conservative)
# ============================================================
aggressive:
  cross_optimizer:
    min_similarity: 0.12
    tax_weight: 0.6
    similarity_weight: 0.4
    adopt_threshold: 0.50
  devaluation:
    price_multiplier: 0.05
    quantity_multiplier: 0.7
    total_cap: 8000
