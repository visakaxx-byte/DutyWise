# ============================================================
# bparty-pipeline 策略配置文件
# 两支预设: conservative（保守） / aggressive（激进）
# CLI: python pipeline.py --mode conservative
# ============================================================

# --- 品名归类 ---
classifier:
  # keyword: 查表匹配 category_map
  mode: keyword

  # 完整品名→宽泛类别 + HS编码 对照表
  # 格式: "关键词": {category: "宽泛类别名", hs: "XXXXXXXXXX"}
  # 匹配规则: 品名包含左侧关键词 → 替换为右侧 category + 赋 HS 编码
  # 关键词按长度降序匹配，长词优先，避免短词误匹配
  category_map:

    # ============ 收纳/塑料制品 → 塑料贴纸 (3926400090) ============
    邮件收纳架:
      category: "塑料贴纸"
      hs: "3926400090"
    收纳架:
      category: "塑料贴纸"
      hs: "3926400090"
    贴纸:
      category: "塑料贴纸"
      hs: "3926400090"
    纸片:
      category: "塑料贴纸"
      hs: "3926400090"
    胶纸:
      category: "塑料贴纸"
      hs: "3926400090"
    不干胶:
      category: "塑料贴纸"
      hs: "3926400090"
    标签条:
      category: "塑料贴纸"
      hs: "3926400090"
    标签:
      category: "塑料贴纸"
      hs: "3926400090"

    # ============ 存储/收纳容器 → 置物架 (3924104000) ============
