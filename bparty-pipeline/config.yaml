      category: "PVC袋"
      hs: "3923210095"
    PU钱包:
      category: "PVC袋"
      hs: "3923210095"
    涤纶钱包:
      category: "PVC袋"
      hs: "3923210095"
    涤纶手袋:
      category: "PVC袋"
      hs: "3923210095"
    皮革腰带:
      category: "PVC袋"
      hs: "3923210095"

    # ============ 日历/文具 → 日历 (4910006000) ============
